<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; width: 260px; margin: 0; padding: 12px; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    .count { font-size: 22px; font-weight: 700; color: #b8860b; }
    label { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
    select { flex: 1; }
    .buttons { display: flex; gap: 6px; margin-top: 8px; }
    button { flex: 1; cursor: pointer; }
    .muted { color: #888; font-size: 12px; }
    a { color: #b8860b; }
    @media (prefers-color-scheme: dark) { body { background: #1e1e1e; color: #ddd; } }
  </style>
</head>
<body>
  <h1>Deslop the Web</h1>
  <div><span class="count" id="count">–</span> <span id="countLabel">paragraphs collapsed</span></div>
  <div class="muted" id="status"></div>
  <hr>
  <label><input type="checkbox" id="enabled"> Enabled</label>
  <label><input type="checkbox" id="siteDisabled"> Disable on <b id="host">this site</b></label>
  <label>Sensitivity
    <select id="threshold">
      <option value="2">Aggressive</option>
      <option value="3">Balanced</option>
      <option value="5">Lenient</option>
      <option value="8">Only blatant slop</option>
    </select>
  </label>
  <div class="buttons">
    <button id="expandAll">Show all</button>
    <button id="collapseAll">Hide all</button>
  </div>
  <p class="muted"><a href="#" id="options">Custom phrases &amp; settings…</a></p>
  <script src="popup.js"></script>
</body>
</html>
